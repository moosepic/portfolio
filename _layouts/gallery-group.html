---
layout: default
---
<section class="wrap">
  <p class="eyebrow"><a href="{{ '/portfolio/' | relative_url }}">&larr; Portfolio</a></p>
  <h1>{{ page.title }}</h1>
  {% if page.description %}<p class="gallery-description">{{ page.description }}</p>{% endif %}

  <div class="gallery-grid">
    {% assign subgalleries = site.galleries | where: "group", page.group_slug | sort: "order" %}
    {% for g in subgalleries %}
    <a class="gallery-card" href="{{ g.url | relative_url }}">
      <span class="cover" style="background-image: url('{{ g.cover | relative_url }}');"></span>
      <span class="card-label">{{ g.title }} <span class="card-count">— {{ g.images.size }}</span></span>
    </a>
    {% endfor %}
  </div>
</section>
