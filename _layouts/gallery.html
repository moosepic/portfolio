---
layout: default
---
<article class="gallery-page wrap">
  <p class="eyebrow"><a href="{{ '/portfolio/' | relative_url }}">&larr; Portfolio</a></p>
  <h1>{{ page.title }}</h1>
  {% if page.description %}<p class="gallery-description">{{ page.description }}</p>{% endif %}

  <div class="contact-sheet" data-gallery="{{ page.title | slugify }}">
    {% for img in page.images %}
    <button type="button"
            class="frame"
            data-full="{{ img.file | relative_url }}"
            data-caption="{{ img.caption | escape }}"
            data-index="{{ forloop.index0 }}"
            aria-label="Open image {{ forloop.index }} of {{ page.images.size }}: {{ img.caption }}">
      <span class="frame-number">No. {{ forloop.index }}</span>
      <img src="{{ img.file | relative_url }}" alt="{{ img.alt | default: img.caption }}" loading="lazy" draggable="false">
    </button>
    {% endfor %}
  </div>
</article>

<!-- Lightbox: images are rendered onto a canvas with a tiled watermark drawn
     on top at display time, and the browser context menu is suppressed on
     this element, so the ordinary "save image as" path is not available.
     See the README for the honest limits of this. -->
<div class="lightbox" id="lightbox" hidden>
  <button type="button" class="lightbox-close" id="lightboxClose" aria-label="Close">&times;</button>
  <button type="button" class="lightbox-prev" id="lightboxPrev" aria-label="Previous image">&lsaquo;</button>
  <canvas id="lightboxCanvas"></canvas>
  <button type="button" class="lightbox-next" id="lightboxNext" aria-label="Next image">&rsaquo;</button>
  <p class="lightbox-caption" id="lightboxCaption"></p>
</div>

<script>
  window.GALLERY_IMAGES = [
    {% for img in page.images %}
    { src: "{{ img.file | relative_url }}", caption: "{{ img.caption | escape }}" }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ];
  window.WATERMARK_TEXT = "{{ site.author }}";
</script>
