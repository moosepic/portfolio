---
layout: default
---
<article class="post wrap narrow">
  <p class="eyebrow"><a href="{{ '/blog/' | relative_url }}">&larr; Journal</a></p>
  <h1>{{ page.title }}</h1>
  <p class="meta">{{ page.date | date: "%-d %B %Y" }}{% if page.tags.size > 0 %} · {{ page.tags | join: ", " }}{% endif %}</p>
  <div class="post-body">
    {{ content }}
  </div>
</article>
